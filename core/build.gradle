plugins { id 'java-library' }
java { sourceCompatibility = JavaVersion.VERSION_11; targetCompatibility = JavaVersion.VERSION_11 }
dependencies {
    api 'party.iroiro.luajava:luajava:4.1.0'
    api 'party.iroiro.luajava:lua53:4.1.0'
    implementation 'org.jspecify:jspecify:1.0.0'
    runtimeOnly 'com.badlogicgames.jnigen:jnigen-loader:3.1.1'
    runtimeOnly 'com.badlogicgames.jnigen:jnigen-commons:3.1.1'
    testRuntimeOnly 'party.iroiro.luajava:lua53-platform:4.1.0:natives-desktop'
}
if (rootProject.ext.withPrivateAssets) {
    sourceSets.test.java.srcDir rootProject.file('private/test-code')
}
tasks.register('checkPublic', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.funlee.a9.core.PublicChecks'
    jvmArgs '-ea'
    args rootProject.file('app/src/main/assets').absolutePath
}
if (rootProject.ext.withPrivateAssets) {
    def merged = layout.buildDirectory.dir('private-check-assets')
    def prepare = tasks.register('preparePrivateCheckAssets', Sync) {
        from rootProject.file('app/src/main/assets')
        from rootProject.file('private/assets')
        into merged
        duplicatesStrategy = DuplicatesStrategy.FAIL
    }
    tasks.register('checkPrivate', JavaExec) {
        dependsOn testClasses, prepare
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'dev.funlee.a9.core.CoreChecks'
        jvmArgs '-ea'
        args merged.get().asFile.absolutePath, rootProject.file('private/test-fixtures/core').absolutePath
    }
}
