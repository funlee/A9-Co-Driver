plugins { id 'com.android.application' }
android {
    namespace 'dev.funlee.a9'
    compileSdk 36
    buildToolsVersion '36.0.0'
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'dev.funlee.a9local'
        buildConfigField 'boolean', 'PRIVATE_ASSETS_ENABLED', rootProject.ext.withPrivateAssets.toString()
        if (!rootProject.ext.withPrivateAssets) applicationIdSuffix '.source'
        minSdk 26
        targetSdk 35
        versionCode 25
        versionName '0.1.24-local'
        testInstrumentationRunner 'dev.funlee.a9.RecoveryDeviceCheck'
    }
    if (rootProject.ext.withPrivateAssets) {
        sourceSets.main.assets.srcDir rootProject.file('private/assets')
        sourceSets.androidTest.assets.srcDir rootProject.file('private/test-fixtures/android')
        def required = ['data/routes.txt','data/map-rules.tsv','data/progress.lib','data/forms.json',
                        'lua/shared.lua','lua/utilities.lua','lua/workflows.lua','lua/multiplayer_up.lua',
                        'lua/multiplayer_down.lua','lua/cup.lua','lua/special.lua','lua/club.lua','lua/career.lua','lua/daily.lua']
        required.each { path ->
            if (!rootProject.file("private/assets/${path}").isFile())
                throw new GradleException("Missing local private asset: ${path}. See docs/private-assets.md")
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11; coreLibraryDesugaringEnabled true }
}
dependencies {
    implementation project(':core')
    implementation 'party.iroiro.luajava:android:4.1.0:lua53@aar'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
